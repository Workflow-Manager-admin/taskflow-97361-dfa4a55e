<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="TaskVerse - Efficient task management with Kanban boards" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to API domain for better performance -->
    <link rel="preconnect" href="https://vscode-internal-8967-beta.beta01.cloud.kavia.ai" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskverse.app/" />
    <meta property="og:title" content="TaskVerse - Task Management Made Simple" />
    <meta property="og:description" content="Organize your tasks with intuitive Kanban boards. Drag, drop, and manage your workflow efficiently." />
    <meta property="og:image" content="%PUBLIC_URL%/social-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://taskverse.app/" />
    <meta property="twitter:title" content="TaskVerse - Task Management Made Simple" />
    <meta property="twitter:description" content="Organize your tasks with intuitive Kanban boards. Drag, drop, and manage your workflow efficiently." />
    <meta property="twitter:image" content="%PUBLIC_URL%/social-preview.png" />

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    
    <title>TaskVerse - Task Management Made Simple</title>
    
    <!-- Inline critical CSS for performance -->
    <style>
      /* Critical CSS for loading state */
      .loading-fallback {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        z-index: 9999;
      }
      
      .loading-fallback .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top: 3px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      
      .loading-fallback p {
        color: #64748b;
        font-size: 16px;
        margin: 0;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading fallback when React loads */
      #root:not(:empty) + .loading-fallback {
        display: none;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1>TaskVerse</h1>
        <p>You need to enable JavaScript to run this app.</p>
        <p>TaskVerse is a modern web application that requires JavaScript to function properly.</p>
      </div>
    </noscript>
    
    <div id="root"></div>
    
    <!-- Loading fallback while React loads -->
    <div class="loading-fallback">
      <div class="spinner"></div>
      <p>Loading TaskVerse...</p>
    </div>
    
    <!-- Performance monitoring (placeholder for future analytics) -->
    <script>
      // Measure page load time
      window.addEventListener('load', function() {
        const perfData = performance.getEntriesByType('navigation')[0];
        if (perfData) {
          console.log('Page load time:', perfData.loadEventEnd - perfData.fetchStart, 'ms');
        }
      });
    </script>
  </body>
</html>
